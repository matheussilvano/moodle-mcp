[project]
name = "moodle-academic-mcp"
version = "0.1.0"
description = "Community MCP server connecting each student's own Moodle account to AI clients (Claude Code, Codex, ChatGPT)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "moodle-academic-mcp contributors" }]
keywords = ["mcp", "moodle", "model-context-protocol", "education"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "mcp>=1.27,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
pdf = ["pypdf>=4.2"]
postgres = ["asyncpg>=0.29"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.17"]
all = ["moodle-academic-mcp[keyring,pdf,postgres]"]

[project.scripts]
moodle-academic-mcp = "moodle_academic_mcp.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=3.8",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pypdf>=4.2",
  "keyring>=25",
  "reportlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_academic_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README*.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real Moodle sandbox (MOODLE_SANDBOX_URL)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "S110", "B008", "E501", "UP031", "ASYNC240", "ASYNC230"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
